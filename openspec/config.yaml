# OpenSpec Config — gestjobs

schema: spec-driven

context: |
  Project: gestjobs
  Working directory: C:\Users\jlima\Documents\Proyects\gestjobs
  Stack: Next.js 15 (App Router) + TypeScript 5 + Tailwind 3; Supabase
         (Postgres + Auth + Storage) for backend; Resend for email;
         pnpm 9 + Vitest 2 + ESLint 9 for tooling
  Architecture: App Router Server Components + Server Actions; magic-link
                auth; per-tenant RLS via `is_owner(user_id)`; cron route
                protected with `CRON_SECRET` Bearer header; idempotent
                Resend email dispatch
  Testing: Vitest 2 unit tests (63 scenarios across platforms / reminders /
           validation); `pnpm test` + `pnpm test:coverage`; no integration
           or E2E layer provisioned (deferred until Supabase is wired);
           runtime smoke checklist in docs/smoke-tests.md
  Style: TypeScript strict mode; Tailwind utility classes; Server Components
         default, Client Components only when interactivity is required
  Artifact store: openspec
  Execution mode: interactive
  Delivery strategy: ask-always
  Review budget lines: 400
  Chain strategy: feature-branch-chain

# Strict TDD is currently disabled — Phase 6 added a Vitest runner
# but the project follows Standard Mode (write code, lock the contract
# with unit tests, never enforce RED-GREEN-REFACTOR order at the
# phase level). Flip `strict_tdd: true` once every PR runs through
# TDD discipline explicitly.
strict_tdd: false

testing:
  runner:
    available: true
    command: "pnpm test"
    framework: "vitest@2"
  layers:
    unit:
      available: true
      tool: "vitest"
    integration:
      available: false
      tool: ""
    e2e:
      available: false
      tool: ""
  coverage:
    available: true
    command: "pnpm test:coverage"
    provider: "v8"
  quality:
    linter:
      available: true
      command: "pnpm lint"
    type_checker:
      available: true
      command: "pnpm typecheck"
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - Restate the user outcome, not the implementation detail
    - List explicit assumptions and unknowns (stack, runtime, deployment)
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for every scenario
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Each delta MUST declare ADDED, MODIFIED, REMOVED, or RENAMED
  design:
    - Document architecture decisions with rationale and tradeoffs
    - Sequence diagrams for any cross-component flow
    - Flag cross-cutting concerns (auth, persistence, observability) explicitly
  tasks:
    - Group by phase, hierarchical numbering (1, 1.1, 1.2)
    - Each task completable in a single session
    - Mark dependencies between tasks
  apply:
    - Follow existing code patterns once the stack is chosen
    - Add a Vitest unit test next to any pure helper introduced in the slice
    - Add `pnpm lint` fixes as separate fix() commits so CI is green
    tdd: false
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 70
  archive:
    - Warn before merging destructive deltas (REMOVED, RENAMED)
    - Preserve audit trail under openspec/changes/archive/YYYY-MM-DD-{name}/
